<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스마트홈">
<title>스마트홈</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>스마트홈</h1>
    <div id="link" class="link off"><span class="dot"></span><span id="linkText">연결 확인 중</span></div>
  </div>
  <div id="ws" class="ws">실시간 연결 중</div>
</header>

<section class="panel camera" id="cameraPanel" hidden>
  <div class="panel-head"><h2>제스처 카메라</h2><span class="muted" id="cameraState">연결 중</span></div>
  <div class="cam-wrap">
    <img id="cameraImg" alt="라즈베리파이 카메라">
    <div class="cam-msg" id="cameraMsg">카메라 연결 중</div>
  </div>
</section>

<section class="sensors">
  <div class="tile"><div class="k">온도</div><div class="v"><span id="temp">-</span><small>°C</small></div></div>
  <div class="tile"><div class="k">습도</div><div class="v"><span id="hum">-</span><small>%</small></div></div>
  <div class="tile"><div class="k">조도</div><div class="v"><span id="lux">-</span></div></div>
  <div class="tile"><div class="k">사람 감지</div><div class="v"><span id="ir">-</span></div></div>
</section>

<section class="devices">
  <div class="card" data-device="fan">
    <div class="top"><span class="name">팬</span><span class="state" id="fanState">-</span></div>
    <div class="btns"><button data-action="on">켜기</button><button data-action="off">끄기</button></div>
  </div>
  <div class="card" data-device="light">
    <div class="top"><span class="name">전등</span><span class="state" id="lightState">-</span></div>
    <div class="btns"><button data-action="on">켜기</button><button data-action="off">끄기</button></div>
  </div>
  <div class="card" data-device="curtain">
    <div class="top"><span class="name">커튼</span><span class="state" id="curtainState">-</span></div>
    <input type="range" id="curtainRange" min="0" max="100" step="10" value="0" aria-label="커튼 위치">
    <div class="btns"><button data-action="open">열기</button><button data-action="close">닫기</button><button data-action="set">적용</button></div>
  </div>
  <div class="card" data-device="door">
    <div class="top"><span class="name">문</span><span class="state" id="doorState">-</span></div>
    <div class="btns"><button data-action="open">열기</button><button data-action="close">닫기</button></div>
  </div>
</section>

<section class="panel">
  <div class="panel-head"><h2>온습도</h2><span class="muted" id="chartSpan">최근 3분</span></div>
  <canvas id="chart"></canvas>
</section>

<section class="panel">
  <div class="panel-head"><h2>최근 기록</h2></div>
  <ul id="log"></ul>
</section>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
